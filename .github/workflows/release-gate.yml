name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate-test:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 23f3001021@ds.study.iitm.ac.in
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test release gate
        run: |
          python - <<'PY'
          from app import release_gate

          safe = {
              "target": "production",
              "event": "push",
              "ref": "refs/heads/main",
              "workflow": {
                  "trigger": "push",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      },
                      {
                          "owner": "thirdparty",
                          "name": "test",
                          "ref": "0123456789abcdef0123456789abcdef01234567"
                      }
                  ],
                  "environmentApproval": True
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          result = release_gate(safe)

          assert result == {
              "decision": "promote",
              "violations": []
          }

          unsafe = dict(safe)
          unsafe["workflow"] = dict(safe["workflow"])
          unsafe["workflow"]["permissions"] = {
              "contents": "write",
              "packages": "write",
              "id-token": "none"
          }

          result = release_gate(unsafe)

          assert result["decision"] == "block"
          assert "EXCESS_PERMISSION" in result["violations"]

          print("All release-gate tests passed.")
          PY
